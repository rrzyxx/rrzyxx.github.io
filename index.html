<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Photos</title>
<style>
  :root { --bg:#202124; --panel:#131314; --ink:#e8eaed; --muted:#9aa0a6; --line:#3c4043;
          --active:#0b4a82; --hover:#2d2f33; --accent:#8ab4f8; --card:#2a2c30; }
  :root[data-theme="light"] { --bg:#f6f8fc; --panel:#fff; --ink:#1f1f1f; --muted:#5f6368; --line:#dadce0;
          --active:#d3e3fd; --hover:#e9eef6; --accent:#0b57d0; --card:#e3e7ec; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; }
  svg { width:24px; height:24px; fill:currentColor; flex:none; }
  button,a.ib { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-decoration:none; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  header { display:flex; align-items:center; gap:12px; padding:8px 16px; height:64px; }
  .logo { font-size:1.35rem; font-weight:600; letter-spacing:.2px; min-width:150px; }
  #menu { display:none; }
  .ib { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--muted); }
  .ib:hover { background:var(--hover); color:var(--ink); }
  .search { flex:1; max-width:790px; display:flex; align-items:center; gap:12px; padding:0 16px; height:48px;
            background:var(--hover); border-radius:24px; color:var(--muted); }
  .search input { flex:1; background:none; border:0; color:var(--ink); font:inherit; font-size:1rem; outline:0; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:4px; }
  .avatar { width:36px; height:36px; border-radius:50%; background:var(--accent); color:var(--panel);
            display:grid; place-items:center; font-weight:700; margin-left:8px; }

  .layout { flex:1; display:flex; min-height:0; }
  nav { width:256px; padding:8px 12px; display:flex; flex-direction:column; overflow-y:auto; }
  nav h2 { font-size:.9rem; font-weight:600; margin:20px 0 6px 20px; }
  .nav { display:flex; align-items:center; gap:18px; width:100%; height:44px; padding:0 20px;
         border-radius:22px; text-align:left; }
  .nav:hover { background:var(--hover); }
  .nav.on { background:var(--active); font-weight:600; }
  .dot { margin-left:auto; width:10px; height:10px; border-radius:50%; background:#f28b82; }
  .storage { margin-top:auto; padding:16px 8px 8px; border-top:1px solid var(--line); }
  .bar { height:4px; border-radius:2px; background:var(--line); margin:12px 0 8px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  .small { color:var(--muted); font-size:.85rem; }

  main { flex:1; background:var(--panel); border-radius:16px; margin:0 16px 16px 0; padding:16px 18px; overflow-y:auto; }
  main h3 { margin:0 0 12px; font-size:.95rem; font-weight:600; }
  #grid { display:flex; flex-wrap:wrap; gap:4px; }
  #grid::after { content:""; flex-grow:100; }
  .tile { position:relative; height:auto; background:var(--card); overflow:hidden; flex:1 1 200px; }
  .tile > button.open { display:block; width:100%; height:100%; padding:0; }
  .tile img { display:block; width:100%; height:100%; object-fit:cover; }
  .fav { position:absolute; top:6px; right:6px; width:36px; height:36px; border-radius:50%; color:#fff;
         background:rgba(0,0,0,.45); display:grid; place-items:center; opacity:0; transition:opacity .15s; }
  .tile:hover .fav, .fav.on, .fav:focus-visible { opacity:1; }
  .fav.on { color:#f28b82; }
  #msg { color:var(--muted); max-width:60ch; line-height:1.6; padding:16px 0; }

  .del { position:absolute; top:6px; right:48px; width:36px; height:36px; border-radius:50%; color:#fff;
         background:rgba(0,0,0,.45); display:grid; place-items:center; opacity:0; transition:opacity .15s; }
  .tile:hover .del, .del:focus-visible { opacity:1; }
  .play { position:absolute; left:8px; bottom:8px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.55);
          color:#fff; display:grid; place-items:center; pointer-events:none; }
  .play svg { width:20px; height:20px; }
  .tile video { display:block; width:100%; height:100%; object-fit:cover; }
  #viewer video { max-width:92vw; max-height:90vh; }
  #vdel { top:8px; right:60px; }
  @media (hover:none) { .fav, .del { opacity:1; } }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#323232; color:#fff;
           padding:12px 20px; border-radius:6px; display:none; max-width:90vw; z-index:30; }
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.94); display:none; align-items:center; justify-content:center; z-index:20; }
  #viewer.open { display:flex; }
  #viewer img { max-width:92vw; max-height:90vh; }
  #viewer .ib { position:absolute; color:#fff; }
  #vclose { top:8px; left:8px; } #vprev { left:8px; } #vnext { right:8px; } #vfav { top:8px; right:8px; }
  #vprev,#vnext { top:50%; margin-top:-22px; }

  @media (max-width:800px) {
    #menu { display:grid; } .logo { min-width:0; }
    nav { position:fixed; z-index:15; top:64px; bottom:0; left:0; background:var(--bg); transform:translateX(-100%); transition:transform .2s; }
    nav.open { transform:none; }
    main { margin:0; border-radius:16px 16px 0 0; padding:12px; }
    .tools .hide-m { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

  <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.400 17.600 5 12 10.600 6.400 5 5 6.400 10.600 12 5 17.600 6.400 19 12 13.400 17.600 19 19 17.600 13.400 12z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15.400 7.400 14 6l-6 6 6 6 1.400-1.400L10.800 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M8.600 16.600 10 18l6-6-6-6-1.400 1.400 4.600 4.600z"/></symbol>

</svg>

<header>
  <button class="ib" id="menu" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
  <div class="logo">My Photos</div>
  <label class="search">
    <svg><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="Search your photos" aria-label="Search your photos">
  </label>
  <div class="tools">
    <a class="ib" id="upload" target="_blank" rel="noopener" title="Upload photos on GitHub" aria-label="Upload photos"><svg><use href="#i-plus"/></svg></a>
    <button class="ib hide-m" id="help" title="Help" aria-label="Help"><svg><use href="#i-help"/></svg></button>
    <button class="ib" id="theme" title="Light or dark" aria-label="Switch light or dark theme"><svg><use href="#i-theme"/></svg></button>
    <button class="ib hide-m" id="apps" title="Apps" aria-label="Apps"><svg><use href="#i-apps"/></svg></button>
    <div class="avatar" id="avatar" aria-hidden="true">R</div>
  </div>
</header>

<div class="layout">
  <nav id="nav" aria-label="Main">
    <button class="nav on" data-view="photos"><svg><use href="#i-photo"/></svg>Photos</button>
    <button class="nav" data-soon="Updates"><svg><use href="#i-bell"/></svg>Updates<span class="dot"></span></button>
    <h2>Collections</h2>
    <button class="nav" data-soon="Albums"><svg><use href="#i-album"/></svg>Albums</button>
    <button class="nav" data-soon="Documents"><svg><use href="#i-doc"/></svg>Documents</button>
    <button class="nav" data-soon="Screenshots"><svg><use href="#i-shot"/></svg>Screenshots</button>
    <button class="nav" data-view="favs"><svg><use href="#i-star"/></svg>Favourites</button>
    <button class="nav" data-soon="People and pets"><svg><use href="#i-people"/></svg>People and pets</button>
    <button class="nav" data-soon="Places"><svg><use href="#i-pin"/></svg>Places</button>
    <button class="nav" data-view="videos"><svg><use href="#i-video"/></svg>Videos</button>
    <button class="nav" data-view="bin"><svg><use href="#i-trash"/></svg>Bin</button>
    <div class="storage">
      <div class="nav" style="padding:0 12px;cursor:default"><svg><use href="#i-cloud"/></svg>Storage</div>
      <div class="bar"><i id="barfill"></i></div>
      <div class="small" id="storetext">Checking storage…</div>
    </div>
  </nav>

  <main>
    <h3 id="title">All photos</h3>
    <p class="small" id="binnote" style="display:none;margin:0 0 12px">Items here are only hidden in this browser. To delete one forever, use the delete button on the photo and remove the file on GitHub.</p>
    <div id="grid"></div>
    <p id="msg">Loading photos…</p>
  </main>
</div>

<div id="toast" role="status"></div>
<div id="viewer" role="dialog" aria-label="Photo viewer">
  <button class="ib" id="vclose" aria-label="Close"><svg><use href="#i-close"/></svg></button>
  <button class="ib" id="vfav" aria-label="Favourite"><svg><use href="#i-heart"/></svg></button>
  <button class="ib" id="vdel" aria-label="Move to bin"><svg><use href="#i-trash"/></svg></button>
  <button class="ib" id="vprev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
  <img id="big" alt=""><video id="bigv" controls playsinline style="display:none"></video>
  <button class="ib" id="vnext" aria-label="Next"><svg><use href="#i-next"/></svg></button>
</div>

<script>
  // ===== Change these 2 lines =====
  const GITHUB_USER = "YOUR-GITHUB-USERNAME";
  const GITHUB_REPO = "YOUR-REPO-NAME";
  // ================================
  const FOLDER = "photos", LIMIT_MB = 1024;
  const $ = id => document.getElementById(id);
  let all = [], list = [], cur = 0, view = "photos", favs = new Set(), bin = new Set();

  try { favs = new Set(JSON.parse(localStorage.getItem("favs") || "[]")); } catch (e) {}
  try { bin = new Set(JSON.parse(localStorage.getItem("bin") || "[]")); } catch (e) {}
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  const saveFavs = () => { try { localStorage.setItem("favs", JSON.stringify([...favs])); } catch (e) {} };

  function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block";
    clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 3200); }

  $("upload").href = `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/upload/main/${FOLDER}`;
  $("help").onclick = () => toast("To add photos: click +, upload to the photos folder, then commit.");
  $("apps").onclick = () => toast("Apps: coming soon.");
  $("theme").onclick = () => {
    const r = document.documentElement, next = r.dataset.theme === "light" ? "dark" : "light";
    r.dataset.theme = next; try { localStorage.setItem("theme", next); } catch (e) {}
  };
  $("menu").onclick = () => $("nav").classList.toggle("open");
  document.querySelectorAll(".nav[data-soon]").forEach(b => b.onclick = () => toast(b.dataset.soon + ": coming soon."));
  document.querySelectorAll(".nav[data-view]").forEach(b => b.onclick = () => {
    document.querySelectorAll(".nav").forEach(n => n.classList.remove("on"));
    b.classList.add("on"); view = b.dataset.view; $("nav").classList.remove("open"); render();
  });
  $("q").addEventListener("input", render);

  const isVid = n => /\.(mp4|webm|mov|m4v)$/i.test(n);
  const ghFile = n => `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/blob/main/${FOLDER}/${encodeURIComponent(n)}`;
  const saveBin = () => { try { localStorage.setItem("bin", JSON.stringify([...bin])); } catch (e) {} };
  const TITLES = { photos: "All photos", videos: "Videos", favs: "Favourites", bin: "Bin" };

  function btn(cls, label, icon, fn) {
    const b = document.createElement("button"); b.className = cls; b.title = label;
    b.setAttribute("aria-label", label); b.innerHTML = `<svg><use href="${icon}"/></svg>`; b.onclick = fn; return b;
  }

  function render() {
    const q = $("q").value.trim().toLowerCase();
    list = all.filter(p => {
      const inBin = bin.has(p.name);
      if (!p.name.toLowerCase().includes(q)) return false;
      if (view === "bin") return inBin;
      if (inBin) return false;
      if (view === "videos") return p.video;
      if (view === "favs") return favs.has(p.name);
      return true;
    });
    $("title").textContent = TITLES[view];
    $("grid").textContent = "";
    $("binnote").style.display = view === "bin" && list.length ? "block" : "none";
    $("msg").style.display = list.length ? "none" : "block";
    if (!list.length) $("msg").textContent = !all.length ? ($("msg").dataset.base || "No photos yet.") :
      q ? "Nothing matches your search." :
      view === "favs" ? "No favourites yet. Tap the heart on a photo." :
      view === "videos" ? "No videos yet. Upload .mp4 or .webm files to the photos folder." :
      view === "bin" ? "Bin is empty." : "No photos yet.";
    list.forEach((p, i) => {
      const t = document.createElement("div"); t.className = "tile";
      const size = a => { a = a || 1.5; t.style.flex = `${a * 100} 1 ${a * 220}px`; t.style.aspectRatio = a; };
      size(1.5);
      const open = document.createElement("button"); open.className = "open"; open.setAttribute("aria-label", "Open " + p.name);
      let el;
      if (p.video) {
        el = document.createElement("video"); el.muted = true; el.preload = "metadata"; el.src = p.src + "#t=0.1";
        el.onloadedmetadata = () => size(el.videoWidth / el.videoHeight);
      } else {
        el = new Image(); el.src = p.src; el.alt = p.name; el.loading = "lazy";
        el.onload = () => size(el.naturalWidth / el.naturalHeight);
      }
      open.appendChild(el);
      if (p.video) open.insertAdjacentHTML("beforeend", '<span class="play"><svg><use href="#i-video"/></svg></span>');
      open.onclick = () => show(i);
      t.appendChild(open);
      if (view === "bin") {
        t.append(
          btn("fav", "Restore", "#i-restore", () => { bin.delete(p.name); saveBin(); render(); }),
          btn("del", "Delete forever (on GitHub)", "#i-trash", () => {
            window.open(ghFile(p.name), "_blank", "noopener");
            toast("On GitHub, click the three dots, then Delete file.");
          }));
      } else {
        t.append(
          btn("fav" + (favs.has(p.name) ? " on" : ""), "Favourite", "#i-heart", e => {
            toggleFav(p.name); e.currentTarget.classList.toggle("on"); if (view === "favs") render();
          }),
          btn("del", "Move to bin", "#i-trash", () => { bin.add(p.name); saveBin(); render(); toast("Moved to bin"); }));
      }
      $("grid").appendChild(t);
    });
  }
  function toggleFav(n) { favs.has(n) ? favs.delete(n) : favs.add(n); saveFavs(); }

  function show(i) {
    cur = (i + list.length) % list.length; const p = list[cur];
    const v = $("bigv"), im = $("big");
    v.pause();
    if (p.video) { im.style.display = "none"; v.style.display = "block"; v.src = p.src; v.play().catch(() => {}); }
    else { v.style.display = "none"; v.removeAttribute("src"); im.style.display = "block"; im.src = p.src; im.alt = p.name; }
    $("vfav").style.color = favs.has(p.name) ? "#f28b82" : "#fff";
    $("vdel").style.display = view === "bin" ? "none" : "grid";
    $("viewer").classList.add("open");
  }
  function hide() {
    $("viewer").classList.remove("open"); $("big").removeAttribute("src");
    const v = $("bigv"); v.pause(); v.removeAttribute("src"); render();
  }
  $("vclose").onclick = hide;
  $("vprev").onclick = () => show(cur - 1);
  $("vnext").onclick = () => show(cur + 1);
  $("vfav").onclick = () => { toggleFav(list[cur].name); $("vfav").style.color = favs.has(list[cur].name) ? "#f28b82" : "#fff"; };
  $("vdel").onclick = () => { bin.add(list[cur].name); saveBin(); render(); toast("Moved to bin"); list.length ? show(cur) : hide(); };
  $("viewer").addEventListener("click", e => { if (e.target === $("viewer")) hide(); });
  document.addEventListener("keydown", e => {
    if (!$("viewer").classList.contains("open")) return;
    if (e.key === "Escape") hide();
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);
  });

  async function load() {
    const api = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}`;
    try {
      const res = await fetch(`${api}/contents/${FOLDER}`);
      if (!res.ok) throw new Error(res.status);
      const files = await res.json();
      all = files.filter(f => /\.(jpe?g|png|gif|webp|avif|mp4|webm|mov|m4v)$/i.test(f.name))
        .sort((a, b) => b.name.localeCompare(a.name))
        .map(f => ({ name: f.name, src: `${FOLDER}/${encodeURIComponent(f.name)}`, video: isVid(f.name) }));
      $("msg").dataset.base = "No photos yet. Click + to upload pictures to the photos folder.";
      render();
    } catch (e) {
      $("msg").textContent = "Could not load photos. Check GITHUB_USER and GITHUB_REPO, make sure the repo is public and has a photos folder.";
    }
    try {
      const r = await (await fetch(api)).json();
      const mb = (r.size || 0) / 1024;
      $("barfill").style.width = Math.min(100, mb / LIMIT_MB * 100) + "%";
      $("storetext").textContent = `${mb.toFixed(1)} MB of 1 GB used`;
    } catch (e) { $("storetext").textContent = "Storage unavailable"; }
  }
  load();
</script>
</body>
</html>
