<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>Daily Notes</h1>
        <p class="subtitle">Professional Note Taking</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Create New Note</h2>
            
            <form class="note-form">
                <div class="form-group">
                    <label for="note-title">Title</label>
                    <input type="text" id="note-title" placeholder="Enter note title">
                </div>

                <div class="form-group">
                    <label for="note-date">Date</label>
                    <div class="date-input-container">
                        <input type="text" id="note-date" value="23/09/2026">
                        <span class="calendar-icon">📅</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Content</label>
                    <div class="editor-container">
                        <!-- Toolbar -->
                        <div class="toolbar">
                            <div class="toolbar-group">
                                <button type="button" title="Undo">←</button>
                                <button type="button" title="Redo">→</button>
                            </div>
                            
                            <div class="toolbar-group">
                                <select title="Font Size">
                                    <option>12 pt</option>
                                    <option>14 pt</option>
                                    <option>16 pt</option>
                                </select>
                            </div>

                            <div class="toolbar-group">
                                <button type="button" class="bold" title="Bold">B</button>
                                <button type="button" class="italic" title="Italic">I</button>
                                <button type="button" class="underline" title="Underline">U</button>
                                <button type="button" class="strikethrough" title="Strikethrough">S</button>
                            </div>

                            <div class="toolbar-group">
                                <button type="button" class="text-color" title="Text Color"><u>A</u></button>
                                <button type="button" class="highlight-color" title="Highlight Color"><span class="color-indicator"></span></button>
                            </div>

                            <div class="toolbar-group">
                                <button type="button" title="Align Left">≡</button>
                                <button type="button" title="Align Center">≡</button>
                                <button type="button" title="Align Right">≡</button>
                                <button type="button" title="Justify">≡</button>
                            </div>

                            <div class="toolbar-group">
                                <button type="button" title="Bullet List">⋮≡</button>
                                <button type="button" title="Numbered List">≡⋮</button>
                            </div>
                        </div>
                        
                        <!-- Text Area -->
                        <div class="editor-textarea" contenteditable="true"></div>
                    </div>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
