<!DOCTYPE html>
<html>
<head>
    <title>Contact rrzyxx</title>
</head>
<body>
    <h1>Welcome to my custom domain!</h1>
    <p>Send me an email directly using the form below.</p>

    <form action="https://formspree.io" method="POST">
        <div>
            <label>Your Email:</label><br>
            <input type="email" name="_replyto" required placeholder="name@example.com">
        </div>
        <br>
        <div>
            <label>Your Message:</label><br>
            <textarea name="message" required placeholder="Write your message here..."></textarea>
        </div>
        <br>
        <button type="submit">Send Email</button>
    </form>
</body>
</html>
